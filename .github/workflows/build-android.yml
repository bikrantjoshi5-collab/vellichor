name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck, theme drift check, and tests
        run: |
          npm run typecheck
          npm run lint:theme
          npm test

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Decode private release keystore (if configured in repository secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > android/app/vellichor-release.keystore
            echo "VELLICHOR_KEYSTORE_FILE=$GITHUB_WORKSPACE/android/app/vellichor-release.keystore" >> "$GITHUB_ENV"
            echo "Private release keystore decoded and active."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set; falling back to debug keystore."
          fi

      - name: Build release APK
        env:
          VELLICHOR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VELLICHOR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VELLICHOR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Verify APK signature certificate
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/release/app-release.apk | grep -E "Owner:|Issuer:|Valid" || true

      - name: Rename APK for download
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-latest}"
          cp android/app/build/outputs/apk/release/app-release.apk "vellichor-${TAG_NAME}.apk"

      - name: Upload sideloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vellichor-android-apk
          path: vellichor-*.apk

      - name: Publish GitHub Release with direct APK download
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Vellichor ${{ github.ref_name }}
          generate_release_notes: true
          files: vellichor-*.apk
