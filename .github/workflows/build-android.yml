name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck, theme drift check, and tests
        run: |
          npm run typecheck
          npm run lint:theme
          npm test

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Rename APK for download
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-latest}"
          cp android/app/build/outputs/apk/release/app-release.apk "vellichor-${TAG_NAME}.apk"

      - name: Upload sideloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vellichor-android-apk
          path: vellichor-*.apk

      - name: Publish GitHub Release with direct APK download
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Vellichor ${{ github.ref_name }}
          generate_release_notes: true
          files: vellichor-*.apk
